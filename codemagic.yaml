workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: android-app
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleDebug
    artifacts:
      - android-app/app/build/outputs/apk/**/*.apk
