name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Build Environment
        run: |
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle.tmp
          [ -f settings.gradle ] && cat settings.gradle >> settings.gradle.tmp || echo "include ':app'" >> settings.gradle.tmp
          mv settings.gradle.tmp settings.gradle

          cat << 'EOF' > root_fix.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          [ -f build.gradle ] && cat build.gradle >> root_fix.gradle
          mv root_fix.gradle build.gradle
        working-directory: android-app

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.1.4
          ./gradlew assembleDebug
        working-directory: android-app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
