name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Plugin Repositories
        run: |
          if [ -f settings.gradle ] && ! grep -q "google()" settings.gradle; then
            echo -e "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n$(cat settings.gradle)" > settings.gradle
          fi
        working-directory: android-app

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5
        working-directory: android-app

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android-app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
